apiVersion: v1
kind: Service
metadata:
  name: mongo-router
  labels:
    app: mongo-router
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: mongos
    app.kubernetes.io/instance: mongo-cluster
    app.kubernetes.io/managed-by: percona-server-mongodb-operator
    app.kubernetes.io/name: percona-server-mongodb
    app.kubernetes.io/part-of: percona-server-mongodb
  ports:
    - name: mongodb
      port: 27017
      targetPort: 27017
---
apiVersion: v1
kind: Service
metadata:
  name: auth-db
  labels:
    app: auth-db
spec:
  type: ClusterIP
  selector:
    app: auth-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-aggregate
  labels:
    app: kafka-aggregate
spec:
  type: ClusterIP
  selector:
    app: kafka-aggregate
  ports:
    - name: internal
      port: 29092
      targetPort: 29092
    - name: external
      port: 9092
      targetPort: 9092
    - name: controller
      port: 9093
      targetPort: 9093
---
apiVersion: v1
kind: Service
metadata:
  name: otel-lgtm
  labels:
    app: otel-lgtm
spec:
  type: NodePort
  selector:
    app: otel-lgtm
  ports:
    - name: grafana
      port: 3000
      targetPort: 3000
      nodePort: 30300
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
---
apiVersion: v1
kind: Service
metadata:
  name: bmkg
  labels:
    app: bmkg
spec:
  type: ClusterIP
  selector:
    app: bmkg
  ports:
    - name: http
      port: 8081
      targetPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: pvmbg
  labels:
    app: pvmbg
spec:
  type: ClusterIP
  selector:
    app: pvmbg
  ports:
    - name: http
      port: 8082
      targetPort: 8082
---
apiVersion: v1
kind: Service
metadata:
  name: aggregate
  labels:
    app: aggregate
spec:
  clusterIP: None
  selector:
    app: aggregate-api
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
---
apiVersion: v1
kind: Service
metadata:
  name: aggregate-http
  labels:
    app: aggregate-http
spec:
  type: ClusterIP
  selector:
    app: aggregate
  ports:
    - name: http
      port: 50052
      targetPort: 50052
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  labels:
    app: auth-service
spec:
  clusterIP: None
  selector:
    app: auth-service
  ports:
    - name: grpc
      port: 8083
      targetPort: 8083
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    app: gateway
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-admin
  labels:
    app: gateway
spec:
  type: ClusterIP
  selector:
    app: gateway
  ports:
    - name: admin
      port: 9901
      targetPort: 9901
