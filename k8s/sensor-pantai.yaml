apiVersion: apps/v1
kind: Deployment
metadata:
  name: sensor-pantai
  labels:
    app: sensor-pantai
    role: sensor
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sensor-pantai
  template:
    metadata:
      labels:
        app: sensor-pantai
        role: sensor
    spec:
      containers:
        - name: sensor
          image: sustuna/sensor-pantai@sha256:51fbd90d3891ad6e9f5768ad330ffb65205644cb29e50da65c7538f2e0b4397d
          imagePullPolicy: IfNotPresent
          env:
            - name: PANTAI_PROFILE
              value: practice
            - name: PANTAI_SEED
              value: "42"
            - name: PANTAI_SPEED
              value: "60"
            - name: PANTAI_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: pantai-token
                  key: token
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: sensor-pantai
  labels:
    app: sensor-pantai
spec:
  type: ClusterIP
  selector:
    app: sensor-pantai
  ports:
    - name: http
      port: 8080
      targetPort: 8080
