apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: bnpb-observability
        orgId: 1
        folder: BNPB
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-json
data:
  bnpb-overview.json: |
    {
      "uid": "bnpb-overview",
      "title": "BNPB Disaster Information System - Unified Observability",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Request & Operation Latency (p50 / p95 / p99)",
          "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 },
          "targets": [
            { "expr": "histogram_quantile(0.50, sum(rate(http_server_duration_milliseconds_bucket[1m])) by (le, service_name))", "legendFormat": "p50 {{service_name}}" },
            { "expr": "histogram_quantile(0.95, sum(rate(http_server_duration_milliseconds_bucket[1m])) by (le, service_name))", "legendFormat": "p95 {{service_name}}" },
            { "expr": "histogram_quantile(0.99, sum(rate(http_server_duration_milliseconds_bucket[1m])) by (le, service_name))", "legendFormat": "p99 {{service_name}}" }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Throughput (req/s & events/s)",
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 8 },
          "targets": [
            { "expr": "sum(rate(aggregate_ingest_events_total[1m])) by (status)", "legendFormat": "ingest {{status}}" },
            { "expr": "sum(rate(kafka_messages_consumed_total[1m])) by (topic, status)", "legendFormat": "kafka {{topic}} {{status}}" }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Error Rate (gRPC / Kafka / Poll)",
          "gridPos": { "x": 0, "y": 8, "w": 12, "h": 8 },
          "targets": [
            { "expr": "sum(rate(aggregate_grpc_requests_total{status!=\"OK\"}[1m])) by (method)", "legendFormat": "grpc err {{method}}" },
            { "expr": "sum(rate(kafka_messages_consumed_total{status!=\"success\"}[1m])) by (topic, status)", "legendFormat": "kafka err {{topic}} {{status}}" }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "MongoDB Latency, DLQ & Fencing Rejections",
          "gridPos": { "x": 12, "y": 8, "w": 12, "h": 8 },
          "targets": [
            { "expr": "histogram_quantile(0.95, sum(rate(aggregate_mongo_operation_duration_ms_bucket[1m])) by (le, operation))", "legendFormat": "mongo p95 {{operation}}" },
            { "expr": "sum(rate(aggregate_fencing_rejected_total[1m]))", "legendFormat": "stale fencing rejected" }
          ]
        }
      ]
    }
