apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  labels:
    app: auth-service
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
        role: api
    spec:
      initContainers:
        - name: auth-keygen
          image: auth-service:dev
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              memory: "128Mi"
            limits:
              memory: "256Mi"
          command:
            - ./auth-service
            - keygen
          envFrom:
            - secretRef:
                name: auth-env
          volumeMounts:
            - name: auth-keys
              mountPath: /app/keys
        - name: auth-seed
          image: auth-service:dev
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              memory: "128Mi"
            limits:
              memory: "256Mi"
          command:
            - sh
            - -c
            - until ./seed; do echo 'waiting for auth-db...'; sleep 2; done
          envFrom:
            - secretRef:
                name: auth-env
      containers:
        - name: auth-service
          image: auth-service:dev
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              memory: "128Mi"
            limits:
              memory: "256Mi"
          ports:
            - containerPort: 8083
              name: grpc
          envFrom:
            - secretRef:
                name: auth-env
          volumeMounts:
            - name: auth-keys
              mountPath: /app/keys
              readOnly: true
          readinessProbe:
            grpc:
              port: 8083
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            grpc:
              port: 8083
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
      volumes:
        - name: auth-keys
          persistentVolumeClaim:
            claimName: auth-keys
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app: gateway
spec:
  replicas: 3
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
        role: api
    spec:
      containers:
        - name: gateway
          image: envoyproxy/envoy:v1.31-latest
          imagePullPolicy: IfNotPresent
          args:
            - "-c"
            - "/etc/envoy/envoy.yaml"
            - "--concurrency"
            - "2"
          resources:
            requests:
              memory: "128Mi"
            limits:
              memory: "256Mi"
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9901
              name: admin
          volumeMounts:
            - name: gateway-config
              mountPath: /etc/envoy/envoy.yaml
              subPath: envoy.yaml
              readOnly: true
            - name: gateway-config
              mountPath: /etc/envoy/descriptors/api.pb
              subPath: api.pb
              readOnly: true
            - name: gateway-config
              mountPath: /etc/envoy/lua/field_filter.lua
              subPath: field_filter.lua
              readOnly: true
          readinessProbe:
            httpGet:
              path: /ready
              port: 9901
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /ready
              port: 9901
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
      volumes:
        - name: gateway-config
          configMap:
            name: gateway-config
