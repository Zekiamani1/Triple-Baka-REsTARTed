---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coastal-adapter
  labels:
    app: coastal-adapter
    role: aggregator
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: coastal-adapter
  template:
    metadata:
      labels:
        app: coastal-adapter
        role: aggregator
    spec:
      initContainers:
        - name: wait-for-pantai-topics
          image: apache/kafka:3.8.1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-aggregate:29092 --describe --topic hazard-ingest >/dev/null 2>&1; do
                echo "Waiting for hazard-ingest topic..."
                sleep 3
              done
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: coastal-adapter
          image: triple-baka-restarted-coastal-poller:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: coastal-adapter-env
          env:
            - name: PANTAI_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: pantai-token
                  key: token
            - name: PANTAI_ADAPTER_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pantai-adapter-db
                  key: password
            - name: PANTAI_STATE_URI
              value: mongodb://pantai-adapter:$(PANTAI_ADAPTER_DB_PASSWORD)@mongo-router:27017/coastal_adapter?authSource=coastal_adapter&retryWrites=true&w=majority
          ports:
            - containerPort: 8089
              name: health
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8089
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8089
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: coastal-adapter
  labels:
    app: coastal-adapter
spec:
  type: ClusterIP
  selector:
    app: coastal-adapter
  ports:
    - name: health
      port: 8089
      targetPort: 8089
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: field-receiver
  labels:
    app: field-receiver
    role: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: field-receiver
  template:
    metadata:
      labels:
        app: field-receiver
        role: api
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: field-receiver
      containers:
        - name: field-receiver
          image: triple-baka-restarted-field-receiver:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: field-receiver-env
          env:
            - name: FIELD_RECEIVER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: field-receiver-token
                  key: token
            - name: FIELD_RECEIVER_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: field-receiver-db
                  key: password
            - name: FIELD_RECEIVER_MONGODB_URI
              value: mongodb://field-receiver:$(FIELD_RECEIVER_DB_PASSWORD)@mongo-router:27017/field_receiver?authSource=field_receiver&retryWrites=true&w=majority
          ports:
            - containerPort: 8090
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8090
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8090
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: field-receiver
  labels:
    app: field-receiver
spec:
  type: ClusterIP
  selector:
    app: field-receiver
  ports:
    - name: http
      port: 8090
      targetPort: 8090
