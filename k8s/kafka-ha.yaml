apiVersion: v1
kind: Service
metadata:
  name: kafka-aggregate-1
  labels:
    app: kafka-ha
    broker-id: "1"
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: kafka-ha
    broker-id: "1"
  ports:
    - name: internal
      port: 29092
      targetPort: 29092
    - name: controller
      port: 9093
      targetPort: 9093
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-aggregate-2
  labels:
    app: kafka-ha
    broker-id: "2"
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: kafka-ha
    broker-id: "2"
  ports:
    - name: internal
