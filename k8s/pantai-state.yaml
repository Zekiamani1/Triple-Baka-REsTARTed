apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pantai-state-access
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: percona-server-mongodb
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - aggregate-api
                  - aggregate-ingester
                  - aggregate-pantai
                  - coastal-adapter
                  - field-receiver
                  - mongo-cluster-init
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: percona-server-mongodb
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: psmdb-operator
      ports:
        - protocol: TCP
          port: 27017
