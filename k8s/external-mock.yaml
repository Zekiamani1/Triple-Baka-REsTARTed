apiVersion: apps/v1
kind: Deployment
metadata:
  name: bmkg
  labels:
    app: bmkg
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bmkg
  template:
    metadata:
      labels:
        app: bmkg
        role: mock
    spec:
      containers:
        - name: bmkg
          image: triple-baka-restarted-bmkg:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: GOMEMLIMIT
              value: "96MiB"
          resources:
            requests:
              memory: "64Mi"
            limits:
              memory: "128Mi"
          ports:
            - containerPort: 8081
              name: http
          envFrom:
            - secretRef:
                name: bmkg-env
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          volumeMounts:
            - name: bmkg-data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
      volumes:
        - name: bmkg-data
          persistentVolumeClaim:
            claimName: bmkg-data
---
