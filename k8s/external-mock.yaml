apiVersion: apps/v1
kind: Deployment
metadata:
  name: bmkg
  labels:
    app: bmkg
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bmkg
  template:
    metadata:
      labels:
        app: bmkg
    spec:
      containers:
        - name: bmkg
          image: aat-bmkg:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: http
          envFrom:
            - secretRef:
                name: bmkg-env
          volumeMounts:
            - name: bmkg-data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
      volumes:
        - name: bmkg-data
          persistentVolumeClaim:
            claimName: bmkg-data
