apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sistem-informasi-kebencanaan-bnpb

resources:
  - k8s/namespace.yaml
  - k8s/storage.yaml
  - k8s/databases.yaml
  - k8s/observability.yaml
  - k8s/external-mock.yaml
  - k8s/core.yaml
  - k8s/networking.yaml
  - k8s/network-policies.yaml
  - k8s/rbac-audit.yaml
  - k8s/analytics.yaml
  - k8s/sensor-pantai.yaml
  - k8s/pantai-state.yaml
  - k8s/pantai.yaml
  - k8s/kafka-ha.yaml

secretGenerator:
  - name: auth-env
    envs:
      - Auth Service/.env
  - name: bmkg-env
    envs:
      - External System/BMKG/.env
  - name: pvmbg-env
    envs:
      - External System/PVMBG/.env
  - name: bmkg-poller-env
    envs:
      - Poller Service/BMKG Poller Service/.env
  - name: pvmbg-poller-env
    envs:
      - Poller Service/PVMBG Poller Service/.env
  - name: audit-secret
    envs:
      - .env.example
  - name: alert-consumer-env
    envs:
      - Alert Consumer/.env

configMapGenerator:
  - name: kafka-env
    literals:
      - CLUSTER_ID=4L6g3nShT-eMCtK--X86sw
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=CONTROLLER://:9093,INTERNAL://:29092,EXTERNAL://:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka-aggregate-1:9093,2@kafka-aggregate-2:9093,3@kafka-aggregate-3:9093
      - KAFKA_LOG_DIRS=/var/lib/kafka/data
      - KAFKA_DEFAULT_REPLICATION_FACTOR=3
      - KAFKA_MIN_INSYNC_REPLICAS=2
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=3
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=3
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=2
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_NUM_PARTITIONS=12
      - KAFKA_HEAP_OPTS=-Xmx384m -Xms256m
  - name: aggregate-env
    envs:
      - Aggregate Service/.env
  - name: event-consumer-env
    envs:
      - Event Consumer/.env
  - name: auth-db-migrations
    files:
      - Auth Service/migrations/001_create_clients.sql
  - name: gateway-config
    files:
      - API Gateway/envoy.yaml
      - API Gateway/lua/field_filter.lua
      - API Gateway/descriptors/api.pb
  - name: grafana-dashboards-provider
    files:
      - infra/grafana/dashboards.yaml
  - name: grafana-dashboards-json
    files:
      - infra/grafana/bnpb-overview.json
  - name: coastal-adapter-env
    literals:
      - SENSOR_BASE_URL=http://sensor-pantai:8080
      - POLL_INTERVAL_MS=1000
      - HTTP_TIMEOUT_MS=1000
      - BREAKER_FAILURE_THRESHOLD=3
      - BREAKER_OPEN_MS=10000
      - KAFKA_BROKERS=kafka-aggregate:29092
      - KAFKA_TOPIC_PANTAI_INGEST=hazard-ingest
      - KAFKA_TOPIC_PANTAI_QUARANTINE=pantai-quarantine
      - HEALTH_PORT=8089
      - OTEL_SERVICE_NAME=coastal-poller
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-lgtm:4317
      - MAX_OBSERVATION_AGE_MS=1800000
      - MAX_FUTURE_SKEW_MS=0
  - name: field-receiver-env
    literals:
      - FIELD_RECEIVER_PORT=8090
      - FIELD_RECEIVER_DB=field_receiver
      - FIELD_RECEIVER_COLLECTION=notification_receipts
      - FIELD_RECEIVER_MAX_BODY_BYTES=1048576
      - OTEL_SERVICE_NAME=field-receiver
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-lgtm:4317
