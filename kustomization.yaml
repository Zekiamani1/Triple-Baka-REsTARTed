apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sistem-informasi-kebencanaan-bnpb

resources:
  - k8s/namespace.yaml
  - k8s/storage.yaml
  - k8s/databases.yaml
  - k8s/observability.yaml
  - k8s/grafana-dashboards.yaml
  - k8s/external-mock.yaml
  - k8s/core.yaml
  - k8s/networking.yaml
  - k8s/network-policies.yaml

secretGenerator:
  - name: auth-env
    envs:
      - Auth Service/.env
  - name: bmkg-env
    envs:
      - External System/BMKG/.env
  - name: pvmbg-env
    envs:
      - External System/PVMBG/.env
  - name: bmkg-poller-env
    envs:
      - Poller Service/BMKG Poller Service/.env
  - name: pvmbg-poller-env
    envs:
      - Poller Service/PVMBG Poller Service/.env

configMapGenerator:
  - name: kafka-env
    literals:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=CONTROLLER://:9093,INTERNAL://:29092,EXTERNAL://:9092
      - KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafka-aggregate:29092,EXTERNAL://localhost:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_NUM_PARTITIONS=1
      - KAFKA_HEAP_OPTS=-Xmx512m -Xms256m
  - name: aggregate-env
    envs:
      - Aggregate Service/.env
  - name: event-consumer-env
    envs:
      - Event Consumer/.env
  - name: alert-consumer-env
    envs:
      - Alert Consumer/.env
  - name: auth-db-migrations
    files:
      - Auth Service/migrations/001_create_clients.sql
  - name: gateway-config
    files:
      - API Gateway/envoy.yaml
      - API Gateway/lua/field_filter.lua
      - API Gateway/descriptors/api.pb
