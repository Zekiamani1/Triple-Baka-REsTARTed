services:
  mongo-aggregate:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  mongo-config:
    image: mongo:8
    command: ["mongod", "--configsvr", "--replSet", "configRS", "--port", "27019", "--bind_ip_all"]
    volumes:
      - mongo-config-data:/data/configdb

  mongo-shard-1:
    image: mongo:8
    command: ["mongod", "--shardsvr", "--replSet", "shard1RS", "--port", "27018", "--bind_ip_all"]
    volumes:
      - mongo-shard-1-data:/data/db

  mongo-shard-2:
    image: mongo:8
    command: ["mongod", "--shardsvr", "--replSet", "shard2RS", "--port", "27018", "--bind_ip_all"]
    volumes:
      - mongo-shard-2-data:/data/db

  mongo-replica-init:
    image: mongo:8
    restart: "no"
    entrypoint: ["mongosh", "--nodb", "--quiet", "/scripts/init-replicas.js"]
    volumes:
      - ./infra/mongo:/scripts:ro
    depends_on:
      - mongo-config
      - mongo-config-2
      - mongo-config-3
      - mongo-shard-1
      - mongo-shard-1-replica-2
      - mongo-shard-1-replica-3
      - mongo-shard-2
      - mongo-shard-2-replica-2
      - mongo-shard-2-replica-3

  mongo-router:
    image: mongo:8
    command: ["mongos", "--configdb", "configRS/mongo-config:27019,mongo-config-2:27019,mongo-config-3:27019", "--port", "27017", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27020:27017"
    depends_on:
      mongo-replica-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ping:1}).ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 30

  mongo-cluster-init:
    image: mongo:8
    restart: "no"
    entrypoint: ["mongosh", "--host", "mongo-router", "--quiet", "/scripts/init-cluster.js"]
    environment:
      MONGO_DB_NAME: ${MONGO_DB_NAME:-bnpb}
      MONGO_COLLECTION: ${MONGO_COLLECTION:-hazard_events}
    volumes:
      - ./infra/mongo:/scripts:ro
    depends_on:
      mongo-router:
        condition: service_healthy

  mongo-shard-1-replica-2:
    image: mongo:8
    command: ["mongod", "--shardsvr", "--replSet", "shard1RS", "--port", "27018", "--bind_ip_all"]
    volumes:
      - mongo-shard-1-replica-2-data:/data/db

  mongo-shard-1-replica-3:
    image: mongo:8
    command: ["mongod", "--shardsvr", "--replSet", "shard1RS", "--port", "27018", "--bind_ip_all"]
    volumes:
      - mongo-shard-1-replica-3-data:/data/db

  mongo-shard-2-replica-2:
    image: mongo:8
    command: ["mongod", "--shardsvr", "--replSet", "shard2RS", "--port", "27018", "--bind_ip_all"]
    volumes:
      - mongo-shard-2-replica-2-data:/data/db

  mongo-shard-2-replica-3:
    image: mongo:8
    command: ["mongod", "--shardsvr", "--replSet", "shard2RS", "--port", "27018", "--bind_ip_all"]
    volumes:
      - mongo-shard-2-replica-3-data:/data/db

  mongo-config-2:
    image: mongo:8
    command: ["mongod", "--configsvr", "--replSet", "configRS", "--port", "27019", "--bind_ip_all"]
    volumes:
      - mongo-config-2-data:/data/configdb

  mongo-config-3:
    image: mongo:8
    command: ["mongod", "--configsvr", "--replSet", "configRS", "--port", "27019", "--bind_ip_all"]
    volumes:
      - mongo-config-3-data:/data/configdb

  kafka-aggregate:
    image: apache/kafka:latest
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:29092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-aggregate:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-aggregate:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1536M
    volumes:
      - kafka-data:/var/lib/kafka/data
  kafka-init:
    image: apache/kafka:latest
    depends_on:
      kafka-aggregate:
        condition: service_healthy
    command:
      - /opt/kafka/bin/kafka-topics.sh
      - --bootstrap-server
      - kafka-aggregate:29092
      - --create
      - --if-not-exists
      - --topic
      - hazard-events
      - --partitions
      - "1"
      - --replication-factor
      - "1"
  kafka-init-ingest:
    image: apache/kafka:latest
    depends_on:
      kafka-aggregate:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-aggregate:29092 --create --if-not-exists --topic hazard-ingest --partitions 12 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-aggregate:29092 --create --if-not-exists --topic field-reports-ingest --partitions 12 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-aggregate:29092 --create --if-not-exists --topic hazard-dlq --partitions 3 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-aggregate:29092 --create --if-not-exists --topic hazard-retry --partitions 3 --replication-factor 1
  aggregate:
    build: 
        context: "./Aggregate Service"
        network: host
    expose:
      - "50051"
      - "50052"
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: "1.5"
          memory: 768M
    init: true
    stop_grace_period: 40s
    env_file: "./Aggregate Service/.env"
    environment:
      AGGREGATE_MODE: all
      NODE_OPTIONS: "--max-old-space-size=512"
      MONGO_URI: mongodb://mongo-router:27017/?readPreference=secondaryPreferred
      AGGREGATOR_PORT: "50051"
      KAFKA_CONSUMER_GROUP: aggregate-ingestion
      MONGO_DB_NAME: ${MONGO_DB_NAME:-bnpb}
      MONGO_COLLECTION: ${MONGO_COLLECTION:-hazard_events}
      AUDIT_API_TOKEN: ${AUDIT_API_TOKEN:-dev-audit-token}
    networks:
      default:
        aliases:
          - aggregate-http
    depends_on:
      mongo-cluster-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      kafka-init-ingest:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "grpcurl -plaintext -import-path /app -proto health.proto -d '{\"service\":\"\"}' localhost:$${AGGREGATOR_PORT} grpc.health.v1.Health/Check | grep -q '\"SERVING\"'"]
      interval: 5s
      timeout: 3s
      retries: 10
  kafka-init-pantai:
    image: apache/kafka:latest
    depends_on:
      kafka-aggregate:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        for topic in pantai-ingest pantai-quarantine hazard-critical; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-aggregate:29092 --create --if-not-exists --topic "$$topic" --partitions 3 --replication-factor 1
        done
  aggregate-pantai:
    build: "./Aggregate Service"
    env_file: "./Aggregate Service/.env"
    environment:
      KAFKA_BROKERS: kafka-aggregate:29092
      KAFKA_CLIENT_ID: aggregate-pantai
      KAFKA_CONSUMER_GROUP: aggregate-pantai-ingestion
      KAFKA_TOPIC_HAZARD_INGEST: pantai-ingest
      KAFKA_TOPIC_HAZARD_EVENTS: hazard-events
      KAFKA_SUBSCRIBE_AUXILIARY_TOPICS: "false"
      KAFKA_EXPECTED_SOURCE: SENSOR_PANTAI
      AGGREGATE_MODE: ingester
      AGGREGATOR_PORT: "50051"
    depends_on:
      mongo-aggregate:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
      kafka-init-pantai:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "grpcurl -plaintext -proto /app/health.proto -d '{\"service\":\"\"}' localhost:50051 grpc.health.v1.Health/Check | grep -q '\"SERVING\"'"]
      interval: 5s
      timeout: 3s
      retries: 10
  bmkg:
    build:
      context: "./External System/BMKG"
      network: host
    ports:
      - "8081:8081"
    env_file: "./External System/BMKG/.env"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    volumes:
      - bmkg-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1$${BMKG_LISTEN_ADDR}/health >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20
  pvmbg:
    build:
      context: "./External System/PVMBG"
      network: host
    ports:
      - "8082:8082"
    env_file: "./External System/PVMBG/.env"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    volumes:
      - pvmbg-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1$${PVMBG_LISTEN_ADDR}/health >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20
  bmkg-poller:
    build:
      context: "./Poller Service/BMKG Poller Service"
      network: host
    env_file: "./Poller Service/BMKG Poller Service/.env"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    depends_on:
      bmkg:
        condition: service_healthy
      kafka-init-ingest:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8085/health >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped
  pvmbg-poller:
    build:
      context: "./Poller Service/PVMBG Poller Service"
      network: host
    env_file: "./Poller Service/PVMBG Poller Service/.env"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    depends_on:
      pvmbg:
        condition: service_healthy
      kafka-init-ingest:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8086/health >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped
  satellite-poller:
    profiles: ["p4"]
    build: "./Poller Service/Satellite Poller Service"
    env_file:
      - path: "./Poller Service/Satellite Poller Service/.env"
        required: false
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    depends_on:
      kafka-init-ingest:
        condition: service_completed_successfully
    volumes:
      - satellite-poller-data:/var/lib/satellite-poller
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8087/health >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped
  event-consumer:
    build: 
      context: "./Event Consumer"
      network: host
    env_file: "./Event Consumer/.env"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8087/health >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 10
  alert-consumer:
    build:
      context: "./Alert Consumer"
      network: host
    env_file: "./Alert Consumer/.env"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8088/health >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 10
  auth-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_pass
      POSTGRES_DB: auth
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    volumes:
      - auth-db-data:/var/lib/postgresql/data
      - ./Auth Service/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15
  auth-keygen:
    build: 
      context: ./Auth Service
      network: host
    image: auth-service:dev
    command: ["./auth-service", "keygen"]
    env_file: ./Auth Service/.env
    volumes:
      - auth-keys:/app/keys
    restart: "no"
  auth-seed:
    build:
      context: ./Auth Service
      network: host
    image: auth-service:dev
    command: ["./seed"]
    env_file: ./Auth Service/.env
    depends_on:
      auth-db:
        condition: service_healthy
    restart: "no"
  auth-service:
    build:
      context: ./Auth Service
      network: host
    image: auth-service:dev
    env_file: ./Auth Service/.env
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1.5"
          memory: 512M
    depends_on:
      auth-db:
        condition: service_healthy
      auth-seed:
        condition: service_completed_successfully
      auth-keygen:
        condition: service_completed_successfully
    expose:
      - "8083"       # gRPC — scaled replicas reached via Envoy STRICT_DNS
    volumes:
      - auth-keys:/app/keys:ro
    healthcheck:
      test: ["CMD-SHELL", "grpcurl -plaintext -proto health.proto -d '{\"service\":\"\"}' localhost:$${AUTH_PORT} grpc.health.v1.Health/Check | grep -q SERVING"]
      interval: 5s
      timeout: 3s
      retries: 10
  gateway:
    image: envoyproxy/envoy:v1.31-latest
    container_name: api-gateway
    command: ["-c", "/etc/envoy/envoy.yaml", "--concurrency", "2"]
    ports:
      - "8080:8080"             # REST, client-facing
      - "127.0.0.1:9901:9901"   # admin/debug UI (loopback only)
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 768M
    volumes:
      - ./API Gateway/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ./API Gateway/descriptors:/etc/envoy/descriptors:ro
      - ./API Gateway/lua:/etc/envoy/lua:ro
    depends_on:
      auth-service:
        condition: service_healthy
      aggregate:
        condition: service_healthy
  analytics-dashboard:
    build:
      context: "./Analytics Dashboard"
      network: host
    ports:
      - "30081:80"
    depends_on:
      gateway:
        condition: service_started
  otel-lgtm:
    image: grafana/otel-lgtm:latest
    ports:
      - "3000:3000"
    expose:
      - "4317"
      - "4318"
    volumes:
      - lgtm-data:/data
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/health >/dev/null 2>&1 || curl -sf http://127.0.0.1:3000/api/health >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
volumes:
  mongo-config-data:
  mongo-shard-1-data:
  mongo-shard-2-data:
  mongo-data:
  satellite-poller-data:
  kafka-data:
  bmkg-data:
  pvmbg-data:
  auth-db-data:
  auth-keys:
  lgtm-data:
  mongo-shard-1-replica-2-data:
  mongo-shard-1-replica-3-data:
  mongo-shard-2-replica-2-data:
  mongo-shard-2-replica-3-data:
  mongo-config-2-data:
  mongo-config-3-data:
