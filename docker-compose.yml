services:
  mongo-aggregate:
    image: mongo:8
    ports:
      - "27017:27017"
  kafka-aggregate:
    image: apache/kafka:latest
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:29092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-aggregate:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-aggregate:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - kafka-data:/var/lib/kafka/data
  kafka-init:
    image: apache/kafka:latest
    depends_on:
      kafka-aggregate:
        condition: service_healthy
    command:
      - /opt/kafka/bin/kafka-topics.sh
      - --bootstrap-server
      - kafka-aggregate:29092
      - --create
      - --if-not-exists
      - --topic
      - hazard-events
      - --partitions
      - "1"
      - --replication-factor
      - "1"
  kafka-init-ingest:
    image: apache/kafka:latest
    depends_on:
      kafka-aggregate:
        condition: service_healthy
    command:
      - /opt/kafka/bin/kafka-topics.sh
      - --bootstrap-server
      - kafka-aggregate:29092
      - --create
      - --if-not-exists
      - --topic
      - hazard-ingest
      - --partitions
      - "1"
      - --replication-factor
      - "1"
  aggregate:
    build: "./Aggregate Service"
    ports:
      - "50051:50051"
    environment:
      MONGO_URI: mongodb://mongo-aggregate:27017
      MONGO_DB_NAME: bnpb
      MONGO_COLLECTION: hazard_events
      AGGREGATOR_PORT: 50051
      KAFKA_BROKERS: kafka-aggregate:29092
      KAFKA_CLIENT_ID: aggregate-service
      KAFKA_CONSUMER_GROUP: aggregate-ingestion
      KAFKA_TOPIC_HAZARD_INGEST: hazard-ingest
      KAFKA_TOPIC_HAZARD_EVENTS: hazard-events
    depends_on:
      mongo-aggregate:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
      kafka-init-ingest:
        condition: service_completed_successfully
  bmkg:
    build: "./External System/BMKG"
    ports:
      - "8081:6767"
    volumes:
      - bmkg-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:6767/health >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20
  pvmbg:
    build: "./External System/PVMBG"
    ports:
      - "8082:6767"
    volumes:
      - pvmbg-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:6767/health >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20
  bmkg-poller:
    build: "./Poller Service/BMKG Poller Service"
    environment:
      POLL_INTERVAL_SECONDS: ${BMKG_POLL_INTERVAL_SECONDS:-3}
    depends_on:
      bmkg:
        condition: service_healthy
      kafka-init-ingest:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped
  pvmbg-poller:
    build: "./Poller Service/PVMBG Poller Service"
    environment:
      POLL_INTERVAL_SECONDS: ${PVMBG_POLL_INTERVAL_SECONDS:-3}
    depends_on:
      pvmbg:
        condition: service_healthy
      kafka-init-ingest:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped
  event-consumer:
    build: "./Event Consumer"
    environment:
      KAFKA_BROKERS: kafka-aggregate:29092
      KAFKA_CLIENT_ID: event-consumer
      KAFKA_CONSUMER_GROUP: event-logger
      KAFKA_TOPIC_HAZARD_EVENTS: hazard-events
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped
  alert-consumer:
    build: "./Alert Consumer"
    environment:
      KAFKA_BROKERS: kafka-aggregate:29092
      KAFKA_CLIENT_ID: alert-consumer
      KAFKA_CONSUMER_GROUP: emergency-notifier
      KAFKA_TOPIC_HAZARD_EVENTS: hazard-events
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped
  auth-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_pass
      POSTGRES_DB: auth
    volumes:
      - auth-db-data:/var/lib/postgresql/data
      - ./Auth Service/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15
  auth-keygen:
    build: ./Auth Service
    image: auth-service:dev
    command: ["./auth-service", "keygen"]
    env_file: ./Auth Service/.env
    volumes:
      - auth-keys:/app/keys
    restart: "no"
  auth-seed:
    build: ./Auth Service
    image: auth-service:dev
    command: ["./seed"]
    env_file: ./Auth Service/.env
    depends_on:
      auth-db:
        condition: service_healthy
    restart: "no"
  auth-service:
    build: ./Auth Service
    image: auth-service:dev
    container_name: auth-service
    env_file: ./Auth Service/.env
    depends_on:
      auth-db:
        condition: service_healthy
      auth-seed:
        condition: service_completed_successfully
      auth-keygen:
        condition: service_completed_successfully
    ports:
      - "8083:8083"       # gRPC — clients call IssueToken/RefreshToken directly here
    volumes:
      - auth-keys:/app/keys:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
  gateway:
    image: envoyproxy/envoy:v1.31-latest
    container_name: api-gateway
    ports:
      - "8080:8080"   # REST, client-facing
      - "9901:9901"   # admin/debug UI
    volumes:
      - ./API Gateway/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ./API Gateway/descriptors:/etc/envoy/descriptors:ro
      - ./API Gateway/lua:/etc/envoy/lua:ro
    depends_on:
      auth-service:
        condition: service_healthy
volumes:
  kafka-data:
  bmkg-data:
  pvmbg-data:
  auth-db-data:
  auth-keys:
