services:
  mongo-aggregate:
    image: mongo:8
    ports:
      - "27017:27017"
  kafka-aggregate:
    image: apache/kafka:latest
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:29092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-aggregate:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-aggregate:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - kafka-data:/var/lib/kafka/data
  kafka-init:
    image: apache/kafka:latest
    depends_on:
      kafka-aggregate:
        condition: service_healthy
    command:
      - /opt/kafka/bin/kafka-topics.sh
      - --bootstrap-server
      - kafka-aggregate:29092
      - --create
      - --if-not-exists
      - --topic
      - hazard-events
      - --partitions
      - "1"
      - --replication-factor
      - "1"
  aggregate:
    build: "./Aggregate Service"
    ports:
      - "50051:50051"
    environment:
      MONGO_URI: mongodb://mongo-aggregate:27017
      MONGO_DB_NAME: bnpb
      MONGO_COLLECTION: hazard_events
      AGGREGATOR_PORT: 50051
      KAFKA_BROKERS: kafka-aggregate:29092
      KAFKA_CLIENT_ID: aggregate-service
      KAFKA_TOPIC_HAZARD_EVENTS: hazard-events
    depends_on:
      mongo-aggregate:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
  event-consumer:
    build: "./Event Consumer"
    environment:
      KAFKA_BROKERS: kafka-aggregate:29092
      KAFKA_CLIENT_ID: event-consumer
      KAFKA_CONSUMER_GROUP: event-logger
      KAFKA_TOPIC_HAZARD_EVENTS: hazard-events
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  kafka-data:
