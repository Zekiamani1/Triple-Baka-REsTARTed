services:
  auth-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - auth-db-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  auth-seed:
    build: .
    image: auth-service:dev
    command: ["./seed"]
    env_file: .env
    depends_on:
      auth-db:
        condition: service_healthy
    restart: "no"

  auth-keygen:
    build: .
    image: auth-service:dev
    command: ["./auth-service", "keygen"]
    env_file: .env
    volumes:
      - auth-keys:/app/keys
    restart: "no"

  auth-service:
    build: .
    image: auth-service:dev
    container_name: auth-service
    env_file: .env
    depends_on:
      auth-db:
        condition: service_healthy
      auth-seed:
        condition: service_completed_successfully
      auth-keygen:
        condition: service_completed_successfully
    ports:
      - "8083:8083"
    volumes:
      - auth-keys:/app/keys:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  auth-db-data:
  auth-keys: