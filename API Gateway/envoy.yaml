static_resources:
  listeners:
    - name: rest_listener
      address:
        socket_address: { address: 0.0.0.0, port_value: 8080 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_rest
                codec_type: AUTO
                generate_request_id: true
                preserve_external_request_id: true
                tracing:
                  provider:
                    name: envoy.tracers.opentelemetry
                    typed_config:
                      "@type": type.googleapis.com/envoy.config.trace.v3.OpenTelemetryConfig
                      grpc_service:
                        envoy_grpc:
                          cluster_name: otel_collector
                        timeout: 1s
                      service_name: api-gateway
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        json_format:
                          timestamp: "%START_TIME%"
                          method: "%REQ(:METHOD)%"
                          path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
                          response_code: "%RESPONSE_CODE%"
                          duration_ms: "%DURATION%"
                          correlation_id: "%REQ(X-CORRELATION-ID)%"
                          traceparent: "%REQ(TRACEPARENT)%"
                          upstream_host: "%UPSTREAM_HOST%"
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: backend
                      domains: ["*"]
                      cors:
                        allow_origin_string_match:
                          - prefix: "*"
                        allow_methods: GET, POST, OPTIONS
                        allow_headers: content-type,authorization,x-correlation-id,traceparent,tracestate,baggage
                      routes:
                        - match: { path: "/health" }
                          direct_response:
                            status: 200
                            body: { inline_string: "UP" }
                        - match: { path: "/auth/token" }
                          route: { cluster: auth_service }
                          typed_per_filter_config:
                            envoy.filters.http.local_ratelimit:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                              stat_prefix: rl_auth_token
                              token_bucket: { max_tokens: 10, tokens_per_fill: 10, fill_interval: 60s }
                              filter_enabled:
                                runtime_key: rl_auth_token_enabled
                                default_value: { numerator: 100, denominator: HUNDRED }
                              filter_enforced:
                                runtime_key: rl_auth_token_enforced
                                default_value: { numerator: 100, denominator: HUNDRED }
                        - match: { path: "/auth/refresh" }
                          route: { cluster: auth_service }
                          typed_per_filter_config:
                            envoy.filters.http.local_ratelimit:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                              stat_prefix: rl_auth_refresh
                              token_bucket: { max_tokens: 30, tokens_per_fill: 30, fill_interval: 60s }
                              filter_enabled:
                                runtime_key: rl_auth_refresh_enabled
                                default_value: { numerator: 100, denominator: HUNDRED }
                              filter_enforced:
                                runtime_key: rl_auth_refresh_enforced
                                default_value: { numerator: 100, denominator: HUNDRED }
                        - match: { prefix: "/.well-known/jwks.json"}
                          route: { cluster: auth_service }
                        # JWT claim_to_headers supplies x-client-id before these routes are matched.
                        - match:
                            prefix: "/aggregate/"
                            headers:
                              - name: x-client-id
                                string_match: { exact: "media" }
                          route:
                            cluster: aggregator_service
                            timeout: 30s
                            retry_policy:
                              retry_on: connect-failure,refused-stream,unavailable,reset,5xx
                              num_retries: 1
                              per_try_timeout: 10s
                          typed_per_filter_config:
                            envoy.filters.http.jwt_authn:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.PerRouteConfig
                              requirement_name: auth_provider
                            envoy.filters.http.local_ratelimit:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                              stat_prefix: rl_aggregate_media
                              token_bucket: { max_tokens: 20, tokens_per_fill: 20, fill_interval: 10s }
                              filter_enabled:
                                runtime_key: rl_aggregate_media_enabled
                                default_value: { numerator: 100, denominator: HUNDRED }
                              filter_enforced:
                                runtime_key: rl_aggregate_media_enforced
                                default_value: { numerator: 100, denominator: HUNDRED }
                        - match:
                            prefix: "/aggregate/"
                            headers:
                              - name: x-client-id
                                string_match: { exact: "lapangan" }
                          route:
                            cluster: aggregator_service
                            timeout: 30s
                            retry_policy:
                              retry_on: connect-failure,refused-stream,unavailable,reset,5xx
                              num_retries: 1
                              per_try_timeout: 10s
                          typed_per_filter_config:
                            envoy.filters.http.jwt_authn:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.PerRouteConfig
                              requirement_name: auth_provider
                            envoy.filters.http.local_ratelimit:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                              stat_prefix: rl_aggregate_fieldteam
                              token_bucket: { max_tokens: 200, tokens_per_fill: 200, fill_interval: 10s }
                              filter_enabled:
                                runtime_key: rl_aggregate_fieldteam_enabled
                                default_value: { numerator: 100, denominator: HUNDRED }
                              filter_enforced:
                                runtime_key: rl_aggregate_fieldteam_enforced
                                default_value: { numerator: 100, denominator: HUNDRED }
                        - match: { prefix: "/aggregate/" }
                          route:
                            cluster: aggregator_service
                            timeout: 30s
                            retry_policy:
                              retry_on: connect-failure,refused-stream,unavailable,reset,5xx
                              num_retries: 1
                              per_try_timeout: 10s
                          typed_per_filter_config:
                            envoy.filters.http.jwt_authn:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.PerRouteConfig
                              requirement_name: auth_provider
                            envoy.filters.http.local_ratelimit:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                              stat_prefix: rl_aggregate_default
                              token_bucket: { max_tokens: 50, tokens_per_fill: 50, fill_interval: 10s }
                              filter_enabled:
                                runtime_key: rl_aggregate_default_enabled
                                default_value: { numerator: 100, denominator: HUNDRED }
                              filter_enforced:
                                runtime_key: rl_aggregate_default_enforced
                                default_value: { numerator: 100, denominator: HUNDRED }
                        - match: { prefix: "/analytics/"}
                          route:
                            cluster: aggregator_http
                            timeout: 30s
                          typed_per_filter_config:
                            envoy.filters.http.grpc_json_transcoder:
                              "@type": type.googleapis.com/envoy.config.route.v3.FilterConfig
                              disabled: true
                        - match: { prefix: "/dashboard/"}
                          route:
                            cluster: analytics_dashboard
                            prefix_rewrite: "/"
                            timeout: 15s
                          typed_per_filter_config:
                            envoy.filters.http.grpc_json_transcoder:
                              "@type": type.googleapis.com/envoy.config.route.v3.FilterConfig
                              disabled: true
                        - match: { prefix: "/internal/audit/"}
                          route:
                            cluster: aggregator_http
                            timeout: 30s
                          typed_per_filter_config:
                            envoy.filters.http.grpc_json_transcoder:
                              "@type": type.googleapis.com/envoy.config.route.v3.FilterConfig
                              disabled: true
                        - match: { prefix: "/internal/dlq/"}
                          route:
                            cluster: aggregator_http
                            timeout: 30s
                          typed_per_filter_config:
                            envoy.filters.http.jwt_authn:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.PerRouteConfig
                              requirement_name: auth_provider
                            envoy.filters.http.grpc_json_transcoder:
                              "@type": type.googleapis.com/envoy.config.route.v3.FilterConfig
                              disabled: true
                        - match: { prefix: "/field-reports"}
                          route:
                            cluster: aggregator_http
                            timeout: 15s
                          typed_per_filter_config:
                            envoy.filters.http.jwt_authn:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.PerRouteConfig
                              requirement_name: auth_provider
                            envoy.filters.http.grpc_json_transcoder:
                              "@type": type.googleapis.com/envoy.config.route.v3.FilterConfig
                              disabled: true
                http_filters:
                  - name: envoy.filters.http.cors
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
                  - name: envoy.filters.http.jwt_authn
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                      providers:
                        auth_provider:
                          issuer: bnpb-auth
                          forward: true
                          payload_in_metadata: jwt_payload
                          clear_route_cache: true
                          claim_to_headers:
                            - header_name: x-client-scope
                              claim_name: scope
                            - header_name: x-client-id
                              claim_name: sub
                          remote_jwks:
                            http_uri:
                              uri: "http://gateway-self/.well-known/jwks.json"
                              cluster: auth_jwks_http
                              timeout: 2s
                            cache_duration: 300s
                      requirement_map:
                        auth_provider:
                          provider_name: auth_provider
                  - name: envoy.filters.http.local_ratelimit
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                      stat_prefix: http_local_rate_limiter
                  - name: envoy.filters.http.lua
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                      default_source_code:
                        filename: "/etc/envoy/lua/field_filter.lua"
                  - name: envoy.filters.http.grpc_json_transcoder
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_json_transcoder.v3.GrpcJsonTranscoder
                      proto_descriptor: "/etc/envoy/descriptors/api.pb"
                      services: ["auth.v1.AuthService", "hazard.Aggregate"]
                      match_incoming_request_route: true
                      print_options:
                        add_whitespace: false
                        always_print_primitive_fields: true
                      request_validation_options:
                        reject_unknown_method: true
                        reject_unknown_query_parameters: true
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: auth_service
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: auth_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: auth-service, port_value: 8083 }
    - name: auth_jwks_http
      type: STATIC
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: auth_jwks_http
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: 8080 }
    - name: aggregator_service
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      connect_timeout: 5s
      dns_lookup_family: V4_ONLY
      dns_refresh_rate: 2s
      circuit_breakers:
        thresholds:
          - priority: DEFAULT
            max_connections: 10000
            max_pending_requests: 20000
            max_requests: 20000
            max_retries: 2000
      health_checks:
        - timeout: 2s
          interval: 2s
          unhealthy_threshold: 2
          healthy_threshold: 1
          grpc_health_check:
            service_name: hazard.Aggregate
      outlier_detection:
        consecutive_5xx: 3
        consecutive_gateway_failure: 2
        interval: 2s
        base_ejection_time: 10s
        max_ejection_percent: 50
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: aggregator_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: aggregate, port_value: 50051 }
    - name: aggregator_http
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      connect_timeout: 3s
      dns_lookup_family: V4_ONLY
      dns_refresh_rate: 2s
      load_assignment:
        cluster_name: aggregator_http
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: aggregate-http, port_value: 50052 }
    - name: otel_collector
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      connect_timeout: 2s
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: otel_collector
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: otel-lgtm, port_value: 4317 }
    - name: analytics_dashboard
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      connect_timeout: 3s
      load_assignment:
        cluster_name: analytics_dashboard
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: analytics-dashboard, port_value: 80 }

admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }
